name: Deploy to Inleed (static)

# Push till main -> bygg statisk export (out/) på runnern -> rsync out/ till docroot
# på Inleed -> smoke-test. INGEN Node-server, INGET npm/ssh-restart på servern
# (sajten är ren statik + PHP-mejlare). Detta eliminerar nproc/cagefs-forkproblemen.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

# cancel-in-progress:false – köa deploys istället för att döda en pågående rsync.
concurrency:
  group: inleed-deploy
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.INLEED_SSH_HOST }}
      SSH_USER: ${{ secrets.INLEED_SSH_USER }}
      SSH_PORT: ${{ secrets.INLEED_SSH_PORT }}
      DOCROOT: ${{ secrets.INLEED_DOCROOT }}
      SITE_URL: https://armeringproffs.se
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install & build (static export -> out/)
        run: |
          npm ci
          npm run build

      - name: Guard – require INLEED_DOCROOT
        run: |
          if [ -z "${DOCROOT// }" ]; then
            echo "FEL: secret INLEED_DOCROOT saknas/tom. Sätt den (t.ex. domains/armeringproffs.se/public_html)"
            echo "innan deploy – annars skulle rsync --delete peka på fel katalog. Se docs/DEPLOY.md."
            exit 1
          fi
          echo "DOCROOT satt."

      - name: Verify static output
        run: |
          set -e
          test -f out/index.html
          test -f out/404.html
          test -f out/sendmail.php
          test -f out/.htaccess
          test -f out/sitemap.xml
          test -d out/armering/stockholm
          echo "out/ ser komplett ut."

      - name: Load SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.INLEED_SSH_KEY }}

      # Rsync HELA out/ (inkl. .htaccess och sendmail.php) till docroot. --delete
      # speglar men skyddar Let's Encrypt-validering (.well-known) och ev. cgi-bin.
      # Retry mot tillfälliga ssh-fel.
      - name: Rsync out/ to docroot (with retry)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 15
          max_attempts: 3
          retry_wait_seconds: 45
          command: |
            rsync -az --delete \
              --exclude '.well-known/' \
              --exclude 'cgi-bin/' \
              -e "ssh -p $SSH_PORT -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null" \
              out/ "$SSH_USER@$SSH_HOST:$DOCROOT/"

      - name: Smoke test (fresh static build live)
        run: |
          # Vänta in ev. cache/propagering och kör smoke med några försök.
          for i in 1 2 3 4 5; do
            if bash scripts/smoke.sh "$SITE_URL"; then exit 0; fi
            echo "Smoke-försök $i misslyckades, väntar 15s ..."
            sleep 15
          done
          echo "Smoke-test misslyckades efter flera försök."
          exit 1
